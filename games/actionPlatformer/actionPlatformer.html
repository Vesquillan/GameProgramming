        <script>
            Engine.start(MainMenu)
            //Tests
        let gameObject = new GameObject()
        gameObject.addComponent(new Polygon(), {points: [
            new Vector2(0, -1),
            new Vector2(-1, 1),
            new Vector2(1, 1)
        ]})
        gameObject.addComponent(new Collider())

        let two = new GameObject()
        two.addComponent(new Polygon(), {points: [
            new Vector2(0, -1),
            new Vector2(-1, 1),
            new Vector2(1, 1)
        ]})
        two.addComponent(new Collider())

        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0,0), gameObject))
        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0,0.99999), gameObject))


        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(10000,10000), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,1.1), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,-1.1), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,-1.00001), gameObject))

        console.assert(Collisions.isCollisionPolygonPolygon(gameObject, two))
        two.transform.position = new Vector2(1000, 1000)
        console.assert(!Collisions.isCollisionPolygonPolygon(gameObject, two))
        </script>
